<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录 - 建筑能源管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 400px;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .code-row {
            display: flex;
            gap: 10px;
        }
        .code-row input {
            flex: 1;
        }
        .code-row button {
            width: 120px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .code-row button:hover {
            background: #5a67d8;
        }
        .code-row button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #5a67d8;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .message.success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }
        .message.error {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }
        .timer {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        .switch-links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
        }
        .switch-links a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }
        .switch-links a:hover {
            text-decoration: underline;
        }
        .form-container {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 动态切换的头部 -->
        <div class="login-header">
            <h2 id="formTitle">🔑 密码登录</h2>
            <p id="formDesc">输入用户名和密码</p>
        </div>

        <!-- 密码登录表单 -->
        <div id="passwordForm" class="form-container">
            <div class="input-group">
                <label>用户名/手机号</label>
                <input type="text" id="username" placeholder="请输入用户名或手机号" value="testuser">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" value="123456">
            </div>
            <button class="login-btn" onclick="passwordLogin()">登录</button>
            <div class="switch-links">
                <a onclick="switchToCodeLogin()">验证码登录</a>
                <a onclick="switchToRegister()">立即注册</a>
            </div>
        </div>

        <!-- 验证码登录表单 -->
        <div id="codeForm" class="form-container" style="display: none;">
            <div class="input-group">
                <label>手机号</label>
                <input type="tel" id="codePhone" placeholder="请输入手机号" value="13800138000">
            </div>
            <div class="input-group">
                <label>验证码</label>
                <div class="code-row">
                    <input type="text" id="code" placeholder="请输入验证码">
                    <button id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                </div>
                <div id="timer" class="timer"></div>
            </div>
            <button class="login-btn" onclick="codeLogin()">登录</button>
            <div class="switch-links">
                <a onclick="switchToPasswordLogin()">密码登录</a>
                <a onclick="switchToRegister()">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="form-container" style="display: none;">
            <div class="input-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名" value="newuser">
            </div>
            <div class="input-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号" value="13800138001">
            </div>
            <div class="input-group">
                <label>验证码</label>
                <div class="code-row">
                    <input type="text" id="regCode" placeholder="请输入验证码">
                    <button id="regSendCodeBtn" onclick="sendRegCode()">获取验证码</button>
                </div>
                <div id="regTimer" class="timer"></div>
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码" value="123456">
            </div>
            <button class="login-btn" onclick="register()">注册</button>
            <div class="switch-links">
                <a onclick="switchToPasswordLogin()">密码登录</a>
                <a onclick="switchToCodeLogin()">验证码登录</a>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let countdown = 0;
        let regCountdown = 0;
        let timerInterval;
        let regTimerInterval;

        // 切换到密码登录
        function switchToPasswordLogin() {
            hideAllForms();
            document.getElementById('passwordForm').style.display = 'block';
            document.getElementById('formTitle').innerHTML = '🔑 密码登录';
            document.getElementById('formDesc').innerHTML = '输入用户名和密码';
            clearMessage();
        }

        // 切换到验证码登录
        function switchToCodeLogin() {
            hideAllForms();
            document.getElementById('codeForm').style.display = 'block';
            document.getElementById('formTitle').innerHTML = '📱 验证码登录';
            document.getElementById('formDesc').innerHTML = '输入手机号获取验证码';
            clearMessage();
        }

        // 切换到注册
        function switchToRegister() {
            hideAllForms();
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('formTitle').innerHTML = '📝 用户注册';
            document.getElementById('formDesc').innerHTML = '填写信息完成注册';
            clearMessage();
        }

        function hideAllForms() {
            document.getElementById('passwordForm').style.display = 'none';
            document.getElementById('codeForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
        }

        // 密码登录
        async function passwordLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('请输入用户名和密码', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('登录成功，正在跳转...', 'success');
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user_info));
                    setTimeout(() => {
                        window.location.href = '/static/chat.html';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
            }
        }

        // 验证码登录
        async function codeLogin() {
            const phone = document.getElementById('codePhone').value;
            const code = document.getElementById('code').value;

            if (!phone || !code) {
                showMessage('请填写手机号和验证码', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/auth/login/code`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone, code})
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('登录成功，正在跳转...', 'success');
                    localStorage.setItem('token', data.data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.data.user_info));
                    setTimeout(() => {
                        window.location.href = '/static/chat.html';
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
            }
        }

        // 注册
        async function register() {
            const username = document.getElementById('regUsername').value;
            const phone = document.getElementById('regPhone').value;
            const code = document.getElementById('regCode').value;
            const password = document.getElementById('regPassword').value;

            if (!username || !phone || !code || !password) {
                showMessage('请填写所有字段', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, phone, code, password})
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('注册成功，正在跳转到登录...', 'success');
                    setTimeout(() => {
                        switchToPasswordLogin();
                        document.getElementById('username').value = username;
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
            }
        }

        // 发送验证码（登录页）
        async function sendCode() {
            const phone = document.getElementById('codePhone').value;
            await sendVerificationCode(phone, 'sendCodeBtn', 'timer');
        }

        // 发送验证码（注册页）
        async function sendRegCode() {
            const phone = document.getElementById('regPhone').value;
            await sendVerificationCode(phone, 'regSendCodeBtn', 'regTimer');
        }

        // 通用发送验证码函数
        async function sendVerificationCode(phone, btnId, timerId) {
            const sendBtn = document.getElementById(btnId);

            if (!phone) {
                showMessage('请输入手机号', 'error');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = '发送中...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/send-code`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone})
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage('验证码已发送，请查收', 'success');
                    startCountdown(btnId, timerId, 60);
                } else {
                    showMessage(data.message, 'error');
                    sendBtn.disabled = false;
                    sendBtn.textContent = '获取验证码';
                }
            } catch (error) {
                showMessage('网络错误，请重试', 'error');
                sendBtn.disabled = false;
                sendBtn.textContent = '获取验证码';
            }
        }

        // 倒计时
        function startCountdown(btnId, timerId, seconds) {
            const sendBtn = document.getElementById(btnId);
            const timerDiv = document.getElementById(timerId);
            let countdown = seconds;

            const interval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(interval);
                    sendBtn.disabled = false;
                    sendBtn.textContent = '重新获取';
                    timerDiv.textContent = '';
                } else {
                    sendBtn.textContent = `${countdown}秒后重试`;
                    timerDiv.textContent = `验证码5分钟内有效`;
                }
            }, 1000);
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }

        function clearMessage() {
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';
        }
    </script>
</body>
</html>
