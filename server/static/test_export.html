<!DOCTYPE html>
<html>
<head>
    <title>报表导出测试</title>
</head>
<body>
    <h2>报表导出测试</h2>

    <form id="exportForm">
        <label>建筑ID: <input type="text" name="building_id" value="B001"></label><br>
        <label>开始日期: <input type="date" name="start_date" value="2025-01-01"></label><br>
        <label>结束日期: <input type="date" name="end_date" value="2025-01-31"></label><br>

        <button type="button" onclick="exportCSV()">导出CSV</button>
        <button type="button" onclick="exportExcel()">导出Excel</button>
        <button type="button" onclick="exportPDF()">导出PDF</button>
    </form>

    <script>
        const baseUrl = 'http://localhost:3000';

        function exportCSV() {
            const form = document.getElementById('exportForm');
            const building_id = form.building_id.value;
            const start_date = form.start_date.value;
            const end_date = form.end_date.value;

            window.location.href = `${baseUrl}/api/export/csv?building_id=${building_id}&start_date=${start_date}&end_date=${end_date}`;
        }

        function exportExcel() {
            const form = document.getElementById('exportForm');
            const building_id = form.building_id.value;
            const start_date = form.start_date.value;
            const end_date = form.end_date.value;

            window.location.href = `${baseUrl}/api/export/excel?building_id=${building_id}&start_date=${start_date}&end_date=${end_date}`;
        }

        function exportPDF() {
            const form = document.getElementById('exportForm');
            const building_id = form.building_id.value;
            const start_date = form.start_date.value;
            const end_date = form.end_date.value;

            window.location.href = `${baseUrl}/api/export/pdf?building_id=${building_id}&start_date=${start_date}&end_date=${end_date}`;
        }
    </script>
</body>
</html>
